# crmtwenty production stack (Twenty CRM, Persian edition)
# Usage on the server:  docker compose up -d
# All settings come from the .env file next to this file (see .env.example).

name: crmtwenty

x-twenty-env: &twenty-env
  PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
  SERVER_URL: ${SERVER_URL}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  APP_SECRET: ${APP_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  STORAGE_TYPE: ${STORAGE_TYPE:-local}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
  STORAGE_S3_NAME: ${STORAGE_S3_NAME:-}
  STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
  STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
  STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
  IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED:-false}
  EMAIL_DRIVER: ${EMAIL_DRIVER:-LOGGER}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@example.com}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CRM}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
  EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
  EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}

services:
  server:
    image: ${TWENTY_IMAGE:-ghcr.io/soheilxone0/crmtwenty:latest}
    stop_grace_period: 120s
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-3000}:3000"
    environment:
      <<: *twenty-env
      NODE_PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 60
    restart: always

  worker:
    image: ${TWENTY_IMAGE:-ghcr.io/soheilxone0/crmtwenty:latest}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7
    restart: always
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional automatic HTTPS (Let's Encrypt). Enable with COMPOSE_PROFILES=https
  # in .env and set DOMAIN. Skip it if you already run nginx/another proxy.
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

volumes:
  db-data:
  server-local-data:
  caddy-data:
  caddy-config:
