
name: Linting Tests

on:
  push:
    branches: [main]

  pull_request:

permissions:
  contents: read

concurrency:
  group: linting-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest
    name: Laravel Pint Code Style

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Report Pint fixes
        if: failure()
        run: |
          vendor/bin/pint --test -v --format=json > pint.json 2>&1 || true
          echo "::error::$(head -c 6000 pint.json | tr '\n' ' ')"
          vendor/bin/pint --test -v 2>&1 | grep -E '\.php|✗|⨯|FAIL' | head -40 | while read -r line; do echo "::error::$line"; done
