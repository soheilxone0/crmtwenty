# ساخت ایمیج داکر و استقرار خودکار روی سرور با هر push روی main
# Build the Docker image and deploy it to your server on every push to main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST        IP or hostname of your server
#   SSH_USER        SSH user (must be able to run docker)
#   SSH_PRIVATE_KEY Private key whose public key is in ~/.ssh/authorized_keys
# Optional:
#   SSH_PORT        SSH port (default 22)
#   DEPLOY_PATH     Directory on the server (default /opt/crmtwenty)
#
# If the SSH secrets are not set, the workflow only builds and publishes the
# image to GitHub Container Registry (ghcr.io/<owner>/<repo>).

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Add swap (the frontend build is memory hungry)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build
          sudo swapon /swapfile-build
          free -h

      - uses: actions/checkout@v4

      - name: Compute image name
        id: vars
        run: |
          IMAGE="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Check deploy configuration
        id: check
        run: |
          if [ -z "${SSH_HOST}" ]; then
            echo "SSH_HOST secret is not set: skipping deployment (image was published to GHCR)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'

      - name: Copy deploy files to the server
        if: steps.check.outputs.enabled == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile,deploy/.env.example,deploy/setup-server.sh"
          target: ${{ secrets.DEPLOY_PATH || '/opt/crmtwenty' }}
          strip_components: 1

      - name: Pull the new image and restart
        if: steps.check.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/crmtwenty' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE,DEPLOY_PATH,GHCR_USER,GHCR_TOKEN
          command_timeout: 25m
          script: |
            set -e
            cd "$DEPLOY_PATH"
            if [ ! -f .env ]; then
              echo "No .env found: generating one with random secrets (edit SERVER_URL afterwards!)"
              bash setup-server.sh --env-only
            fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export TWENTY_IMAGE="$IMAGE"
            if grep -q '^TWENTY_IMAGE=' .env; then
              sed -i "s#^TWENTY_IMAGE=.*#TWENTY_IMAGE=${IMAGE}#" .env
            else
              echo "TWENTY_IMAGE=${IMAGE}" >> .env
            fi
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io || true
            docker image prune -f || true
            docker compose ps
