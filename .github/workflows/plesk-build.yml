name: Build for Plesk

# crmtwenty: shared hosting cannot run `composer install` or `npm run build`,
# so this workflow does it on GitHub and publishes a ready-to-run copy of the
# app (with vendor/ and the compiled assets):
#
# one ZIP file attached to the "plesk-latest" release. Upload it with Plesk's
# File Manager and extract it in the site folder. Always available at
# https://github.com/soheilxone0/crmtwenty/releases/latest/download/crm-plesk.zip
#
# (Plesk's Git deployment clones the whole repository history, which is too
# large for the hosting's connection, so the ZIP is the supported way.)

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plesk-build
  cancel-in-progress: false

jobs:
  build:
    name: Build the Plesk ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # The lowest PHP version the app supports, so the bundled vendor/
          # works on any PHP 8.3+ selected in Plesk.
          php-version: '8.3'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies (no dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Build admin assets
        working-directory: packages/Webkul/Admin
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Assemble the production copy
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"

          # Every file tracked in Git, minus development-only folders …
          git ls-files -z \
            | grep -zv -E '^(\.github|\.ai|\.claude|\.codex|tests|packages/Webkul/Admin/tests)/' \
            | tar --null -T - -cf - | tar -xf - -C "$OUT"

          # … plus what was built above.
          tar -cf - vendor public/admin/build | tar -xf - -C "$OUT"

          # Drop what is never used at run time, to keep the download small:
          # tests, documentation and examples shipped inside packages, and the
          # ar-php .phar (the library is loaded from its src/ folder).
          find "$OUT/vendor" -mindepth 3 -maxdepth 3 -type d \
            \( -name tests -o -name Tests -o -name test -o -name docs -o -name doc -o -name examples \) \
            -prune -exec rm -rf {} +
          rm -f "$OUT/vendor/khaled.alshamaa/ar-php/ArPHP.phar"
          rm -rf "$OUT/.phpunit.cache"

          # Everything in this copy is meant to be deployed, including vendor/.
          cat > "$OUT/.gitignore" <<'EOF'
          /.env
          /storage/*.key
          /storage/installed
          /public/storage
          /public/hot
          EOF

          # Store every file byte-for-byte (no line-ending conversion).
          printf '* -text\n' > "$OUT/.gitattributes"

          printf '%s\n' "${GITHUB_SHA}" > "$OUT/REVISION"

      - name: Smoke-test the production copy
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          cat > "$RUNNER_TEMP/smoke.php" <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $classes = [
              Illuminate\Foundation\Application::class,
              ArPHP\I18N\Arabic::class,
              Mpdf\Mpdf::class,
              Barryvdh\DomPDF\PDF::class,
              Crmtwenty\Persian\Support\Jalali::class,
              Google\Service\PeopleService::class,
          ];
          foreach ($classes as $class) {
              if (! class_exists($class)) {
                  fwrite(STDERR, "missing {$class}\n");
                  exit(1);
              }
          }
          new ArPHP\I18N\Arabic;
          echo Crmtwenty\Persian\Support\Jalali::format('2026-11-14', 'Y/m/d', true, 'Asia/Tehran'), "\n";
          echo "classes ok\n";
          PHP
          php "$RUNNER_TEMP/smoke.php"
          php artisan --version

      - name: Create the ZIP
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          zip -q -r -9 -X "$RUNNER_TEMP/crm-plesk.zip" .
          ls -lh "$RUNNER_TEMP/crm-plesk.zip"
          echo "ZIP_SIZE=$(du -m "$RUNNER_TEMP/crm-plesk.zip" | cut -f1)" >> "$GITHUB_ENV"

          # Small update package: everything except the third-party libraries in vendor/
          # (their autoloader in vendor/composer is included, so new app classes are found).
          zip -q -r -9 -X "$RUNNER_TEMP/crm-update.zip" . \
            -x 'vendor/*' -x 'public/fonts/*' -x '.gitignore' -x '.gitattributes'
          zip -q -r -9 -X "$RUNNER_TEMP/crm-update.zip" vendor/autoload.php vendor/composer
          ls -lh "$RUNNER_TEMP/crm-update.zip"
          echo "UPDATE_SIZE=$(du -m "$RUNNER_TEMP/crm-update.zip" | cut -f1)" >> "$GITHUB_ENV"

      - name: Publish the ZIP as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          {
            echo "نسخه‌ی آماده‌ی اجرای CRM فارسی برای هاست پلسک (حدود ${ZIP_SIZE} مگابایت)."
            echo
            echo "نصب یا به‌روزرسانی: فایل crm-plesk.zip را در File Manager پلسک داخل پوشه‌ی crm.arounidea.com آپلود کنید، روی آن Extract Files بزنید (با بازنویسی فایل‌ها) و بعد خود فایل ZIP را پاک کنید. فایل .env و اطلاعات شما دست نمی‌خورد."
            echo
            echo "به‌روزرسانی سریع (حدود ${UPDATE_SIZE} مگابایت): اگر CRM از قبل نصب است، به‌جای فایل بزرگ کافی است crm-update.zip را به همان روش آپلود و Extract کنید."
            echo
            echo "راهنمای کامل در README.md مخزن است."
            echo
            echo "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          } > "$RUNNER_TEMP/notes.md"

          gh release delete plesk-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create plesk-latest "$RUNNER_TEMP/crm-plesk.zip" "$RUNNER_TEMP/crm-update.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CRM فارسی برای پلسک (${GITHUB_SHA::7})" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
